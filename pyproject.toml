[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parallplexity"
version = "0.3.0"
description = "Compounding Fractional Parallplexity — fractional-order parallel cognition, CP/GCI phase transitions, Eight-Limb cohesion, emissive lattice spacetime"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Evan Pieser", email = "evan@transcendplexity.com" }]
license = { text = "MIT" }
keywords = ["fractional-calculus", "compounding", "cognition", "phase-transitions", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]
[project.optional-dependencies]
test = ["pytest>=7.0"]
viz = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["parallplexity*"]

[tool.pytest.ini_options]
testpaths = ["parallplexity/tests"]
filterwarnings = ["ignore::DeprecationWarning"]